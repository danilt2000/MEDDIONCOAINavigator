# MEDDI navigator behind Cloudflare (proxied DNS records, Cloudflare origin certificate for *.nastasiya.com).
# Both apps call the API on their own origin under /api; the API itself listens on the host only.
# Port 80 serves the same as 443 so it works with any Cloudflare SSL mode; Cloudflare redirects visitors to HTTPS.

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pacient.nastasiya.com;

    ssl_certificate     /etc/ssl/cloudflare/nastasiya.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/nastasiya.com.key;

    root /opt/meddi/apps/patient-pwa/dist;
    include /opt/meddi/deploy/nginx/meddi-common.inc;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lekar.nastasiya.com;

    ssl_certificate     /etc/ssl/cloudflare/nastasiya.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/nastasiya.com.key;

    root /opt/meddi/apps/doctor-web/dist;
    include /opt/meddi/deploy/nginx/meddi-common.inc;

    # the IRIS Management Portal and FHIR endpoint, public on purpose so the jury can look inside (IRIS login required)
    location ~ ^/(csp|fhir)/ {
        proxy_pass http://127.0.0.1:52773;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
